services:
  - type: web
    name: icon-ads-backend
    env: node
    rootDir: icon-ads-backend
    # starter = 0.5 CPU / 512 MB / US$7 — sin spin-down ni tope de 750 h/mes.
    # NO volver a 'free': el backend atiende la flota 24/7 y se comería el free tier.
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        value: https://icon-ads.vercel.app
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
